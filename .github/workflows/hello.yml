# This is your first GitHub Actions workflow!
# Every workflow needs a name, a trigger, and at least one job.
name: Hello CI                # A friendly name shown in the GitHub UI
on:                            # WHEN should this workflow run?
  push:                        # Run every time code is pushed...
    branches: [main]           # ...to the main branch
jobs:                          # WHAT should this workflow do?
  greet:                       # Job name (you choose this)
    runs-on: ubuntu-latest     # Run on a GitHub-hosted Ubuntu VM
    steps:                     # The individual commands to run, in order
      - name: Say hello
        run: echo "Hello from GitHub Actions!"
      - name: Show the date
        run: date
      - name: Show the runner OS
        run: uname -a
      - name: List files in the repo
        run: ls -la